<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" role="img" aria-label="许愿式点餐">
  <title>许愿式点餐</title>
  <!--
    构成：带锯齿边的小票 + 一颗压在小票右上角的四角星。
      小票  = 账单。本作品的差异不在「省多少」，在「算两遍账」。
      四角星 = 许愿。用户说的是愿望，不是参数。
    配色刻意避开品牌元素与品牌色：票身墨黑，只有星用一点红。
    加浅色圆角底是为了在 GitHub 深色模式下也能看清。
  -->
  <g>
    <!-- 浅色底：让图标在深色背景下仍然成立 -->
    <rect x="0.6" y="0.6" width="126.8" height="126.8" rx="28" fill="#fbfaf7" stroke="#e8e4dc" stroke-width="1.2"/>

    <!-- 小票：顶部圆角，底部五个锯齿（收据特征） -->
    <path d="M39 34
             h46 a7 7 0 0 1 7 7
             v63
             l-6 4 -6 -4 -6 4 -6 -4 -6 4 -6 -4 -6 4 -6 -4 -6 4 -6 -4
             v-63
             a7 7 0 0 1 7 -7 z"
          fill="#17171a"/>

    <!-- 票面符号：人民币记号，代表「这一单多少钱」 -->
    <g stroke="#fbfaf7" stroke-width="4.2" stroke-linecap="round" fill="none">
      <path d="M53.5 50 L62 62"/>
      <path d="M70.5 50 L62 62"/>
      <path d="M62 62 L62 86"/>
      <path d="M54 65.5 L70 65.5"/>
      <path d="M54 74.5 L70 74.5"/>
    </g>

    <!-- 许愿星：四角凹边星形，压在票的右上角，红压黑不加描边 -->
    <path d="M98 19.5
             Q100.4 27.6 108.5 30
             Q100.4 32.4 98 40.5
             Q95.6 32.4 87.5 30
             Q95.6 27.6 98 19.5 Z"
          fill="#c8102e" stroke-linejoin="round"/>
  </g>
</svg>
