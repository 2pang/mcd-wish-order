<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" role="img" aria-label="许愿式点餐">
  <title>许愿式点餐（小尺寸版）</title>
  <!--
    32px 以下专用：去掉人民币符号，只留「小票 + 星 + 一条金额线」。
    16~32px 时细节会糊成一团，符号越多越脏；保留轮廓与红点即可识别。
  -->
  <rect x="0.8" y="0.8" width="126.4" height="126.4" rx="26" fill="#fbfaf7"/>
  <path d="M38 32
           h48 a8 8 0 0 1 8 8
           v66
           l-6.4 4.2 -6.4 -4.2 -6.4 4.2 -6.4 -4.2 -6.4 4.2 -6.4 -4.2
           -6.4 4.2 -6.4 -4.2
           v-66
           a8 8 0 0 1 8 -8 z"
        fill="#17171a"/>
  <rect x="52" y="62" width="30" height="7" rx="3.5" fill="#fbfaf7"/>
  <rect x="52" y="76" width="18" height="7" rx="3.5" fill="#fbfaf7"/>
  <path d="M100 17.5
           Q102.8 27.2 112.5 30
           Q102.8 32.8 100 42.5
           Q97.2 32.8 87.5 30
           Q97.2 27.2 100 17.5 Z"
        fill="#c8102e"/>
</svg>
